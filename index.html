<!DOCTYPE html>
<html>

<head>
    <title>GoalRoute 2026</title>
    <link rel="icon" type="image/png" href="images/ball.png">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="ad_navbar">

    <!-- LOGO BLOCK -->
    <div class="ad_logoContainer">

        <div class="ad_logoIcon">⚽</div>

        <div class="ad_logoText">
            GoalRoute <span>2026</span>
        </div>

    </div>

    <!-- MENU -->
    <div class="ad_menu">
        <a href="#ad_home">Home</a>
        <a href="#ad_cards">Explore</a>
        <a href="#ad_map">Map</a>
    </div>

    <!-- HAMBURGER -->
    <div class="ad_hamburger" onclick="toggleMenu()">☰</div>

</nav>

<!-- ================= HERO ================= -->
<section id="ad_home" class="ad_heroSection">

    <!-- Overlay -->
    <div class="ad_heroOverlay"></div>

    <!-- Content -->
    <div class="ad_heroContent">

        <h1 class="ad_heroTitle">
            PLAN YOUR <span>WORLD CUP</span> JOURNEY
        </h1>

        <p class="ad_heroText">
            Explore stadiums, discover cities, and build your perfect match-day experience across North America.
        </p>

        <!-- CTA BUTTON -->
        <button class="ad_ctaButton" onclick="scrollToExplore()">
            Start Exploring ↓
        </button>

        <!-- Country Filters -->
        <div class="ad_countryButtons">
            <button onclick="selectCountry('canada')">🇨🇦 Canada</button>
            <button onclick="selectCountry('usa')">🇺🇸 USA</button>
            <button onclick="selectCountry('mexico')">🇲🇽 Mexico</button>
        </div>

    </div>

</section>


<!-- ================= MAP ================= -->
<section id="ad_map" class="ad_mapSection">

    <h2 class="ad_sectionTitle">Explore Map</h2>
     <div id="ad_stadiumTags"></div>
    <!-- Controls inside map section -->
    <div class="ad_mapControls">
        <button onclick="togglePlaces('restaurant')">🍝 Restaurants</button>
        <button onclick="togglePlaces('hotel')">🏨 Hotels</button>
        <button onclick="togglePlaces('tourist_attraction')">🎯 Attractions</button>
    </div>

    <div id="ad_mapContainer"></div>

</section>


<!-- ================= INFO PANEL ================= -->
<div id="ad_infoPanel">

    <span id="ad_closePanel" onclick="closePanel()">✖</span>

    <div id="ad_infoContent">

        <h2 id="ad_placeTitle"></h2>

        <!-- Image -->
        <img id="ad_placeImage" src="" alt="stadium">

        <!-- Extra info -->
        <p id="ad_placeDetails"></p>

        <h3>Nearby Restaurants</h3>
        <div id="ad_nearbyList"></div>

    </div>

</div>


<!-- JS -->
<script src="js/script.js"></script>
<script src="js/map.js"></script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAALp6k9INnko-DW664s_wOMrb3nR9qLk8&libraries=places&callback=initMap" async defer></script>

</body>
</html>
